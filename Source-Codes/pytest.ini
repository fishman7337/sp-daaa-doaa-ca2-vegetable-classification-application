[pytest]
addopts =
    -ra
    --strict-markers
    --strict-config
testpaths =
    backend/tests
    model_service/tests
markers =
    unit: Fast unit tests for isolated logic and validation helpers.
    api: REST API tests for auth, prediction, history, and chatbot endpoints.
    validity: Input validity and schema validation checks.
    range: Boundary and range checks on numeric/query parameters.
    consistency: Determinism checks for hashing and normalized payloads.
    expected_failure: Intentional negative-path tests with deterministic failures.
    unexpected_failure: Resilience tests for upstream or malformed service behavior.
    security: Security hardening and penetration-oriented tests.
    e2e: End-to-end flow tests across multiple API boundaries.
    real_vegnet: Use real veggie remote inference path (requests patched in-test).
    docs: Documentation structure and governance checks.
