stages:
  - lint
  - test
  - mlops
  - security
  - build
  - deploy
  - rpa

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

default:
  interruptible: true

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  BACKEND_COVERAGE_MIN: "85"
  MODEL_SERVICE_COVERAGE_MIN: "85"

documentation_structure:
  stage: lint
  image: python:3.11-slim
  script:
    - python scripts/check_readmes.py

lint_backend:
  stage: lint
  image: python:3.11-slim
  script:
    - python -m pip install --upgrade pip
    - pip install -r backend/requirements-dev.txt
    - ruff check backend main.py
    - ruff format --check backend main.py

lint_model_service:
  stage: lint
  image: python:3.11-slim
  script:
    - python -m pip install --upgrade pip
    - pip install -r model_service/requirements-dev.txt
    - ruff check model_service
    - ruff format --check model_service

lint_docstrings:
  stage: lint
  image: python:3.11-slim
  script:
    - python -m pip install --upgrade pip
    - pip install -r backend/requirements-dev.txt
    - ruff check backend/app.py backend/views.py main.py model_service/app.py --select D

backend_tests:
  stage: test
  image: python:3.11-slim
  script:
    - python -m pip install --upgrade pip
    - pip install -r backend/requirements-dev.txt
    - mkdir -p reports
    - pytest backend/tests --cov=backend --cov-report=term-missing:skip-covered --cov-report=xml:reports/backend-coverage.xml --cov-fail-under=${BACKEND_COVERAGE_MIN} --junitxml=reports/backend-tests.xml
  artifacts:
    when: always
    reports:
      junit: reports/backend-tests.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/backend-coverage.xml
    paths:
      - reports/backend-tests.xml
      - reports/backend-coverage.xml

model_service_tests:
  stage: test
  image: python:3.11-slim
  script:
    - python -m pip install --upgrade pip
    - pip install -r model_service/requirements-dev.txt
    - mkdir -p reports
    - pytest model_service/tests --cov=model_service --cov-report=term-missing:skip-covered --cov-report=xml:reports/model-service-coverage.xml --cov-fail-under=${MODEL_SERVICE_COVERAGE_MIN} --junitxml=reports/model-service-tests.xml
  artifacts:
    when: always
    reports:
      junit: reports/model-service-tests.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/model-service-coverage.xml
    paths:
      - reports/model-service-tests.xml
      - reports/model-service-coverage.xml

mlops_model_registry_validate:
  stage: mlops
  image: python:3.11-slim
  needs:
    - backend_tests
    - model_service_tests
  script:
    - python -m pip install --upgrade pip
    - pip install -r model_service/requirements-dev.txt
    - mkdir -p reports
    - python scripts/validate_model_registry.py --models-root models --report reports/model-registry-report.json
  artifacts:
    when: always
    paths:
      - reports/model-registry-report.json

mlops_runtime_smoke:
  stage: mlops
  image: python:3.11-slim
  needs:
    - backend_tests
    - model_service_tests
    - mlops_model_registry_validate
  script:
    - python -m pip install --upgrade pip
    - pip install -r backend/requirements-dev.txt -r model_service/requirements-dev.txt
    - mkdir -p reports
    - |
      set -eu
      python main.py > reports/local-stack.log 2>&1 &
      STACK_PID=$!
      trap 'kill $STACK_PID >/dev/null 2>&1 || true' EXIT
      python scripts/smoke_serving.py --base-url http://127.0.0.1:8000 --wait-seconds 70
      python scripts/smoke_webapp.py --base-url http://127.0.0.1:5000 --wait-seconds 70
  artifacts:
    when: always
    paths:
      - reports/local-stack.log

backend_security_tests:
  stage: security
  image: python:3.11-slim
  script:
    - python -m pip install --upgrade pip
    - pip install -r backend/requirements-dev.txt
    - mkdir -p reports
    - pytest -m security backend/tests --junitxml=reports/backend-security-tests.xml
  artifacts:
    when: always
    reports:
      junit: reports/backend-security-tests.xml
    paths:
      - reports/backend-security-tests.xml

backend_e2e_tests:
  stage: security
  image: python:3.11-slim
  script:
    - python -m pip install --upgrade pip
    - pip install -r backend/requirements-dev.txt
    - mkdir -p reports
    - pytest -m e2e backend/tests --junitxml=reports/backend-e2e-tests.xml
  artifacts:
    when: always
    reports:
      junit: reports/backend-e2e-tests.xml
    paths:
      - reports/backend-e2e-tests.xml

bandit_scan:
  stage: security
  image: python:3.11-slim
  script:
    - python -m pip install --upgrade pip
    - pip install "bandit[toml]>=1.7,<2"
    - mkdir -p reports
    - bandit -r backend model_service -x backend/tests,model_service/tests -ll -ii -s B104 -f json -o reports/bandit-report.json
  artifacts:
    when: always
    paths:
      - reports/bandit-report.json

dependency_audit_python:
  stage: security
  image: python:3.11-slim
  script:
    - python -m pip install --upgrade pip
    - pip install pip-audit
    # inference-sdk currently pins pillow<12 and aiohttp<=3.10.11, while upstream
    # advisories point to fixed versions outside those bounds. Keep workflow support
    # enabled and track these ignores until inference-sdk relaxes its dependency caps.
    - pip-audit -r backend/requirements.txt --ignore-vuln CVE-2026-25990 --ignore-vuln CVE-2025-53643 --ignore-vuln CVE-2025-69223 --ignore-vuln CVE-2025-69224 --ignore-vuln CVE-2025-69225 --ignore-vuln CVE-2025-69226 --ignore-vuln CVE-2025-69227 --ignore-vuln CVE-2025-69228 --ignore-vuln CVE-2025-69229 --ignore-vuln CVE-2025-69230
    - pip-audit -r model_service/requirements.txt --ignore-vuln CVE-2026-25990

secret_scan:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.18.4
    entrypoint: [""]
  script:
    - mkdir -p reports
    - gitleaks detect --source . --no-git --redact --report-format sarif --report-path reports/gitleaks.sarif
  artifacts:
    when: always
    paths:
      - reports/gitleaks.sarif

build_images:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -f backend/Dockerfile -t doaa/backend:ci .
    - docker build -f model_service/Dockerfile -t doaa/model_service:ci .

render_deploy:
  stage: deploy
  image: curlimages/curl:8.6.0
  needs:
    - lint_backend
    - lint_model_service
    - lint_docstrings
    - documentation_structure
    - backend_tests
    - model_service_tests
    - mlops_model_registry_validate
    - mlops_runtime_smoke
    - backend_security_tests
    - backend_e2e_tests
    - bandit_scan
    - dependency_audit_python
    - secret_scan
    - build_images
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $RENDER_BACKEND_DEPLOY_HOOK && $RENDER_MODEL_SERVICE_DEPLOY_HOOK && $AUTO_DEPLOY_MAIN == "true"'
    - if: '$CI_COMMIT_BRANCH == "main" && $RENDER_BACKEND_DEPLOY_HOOK && $RENDER_MODEL_SERVICE_DEPLOY_HOOK'
      when: manual
      allow_failure: false
  script:
    - curl -fsS -X POST "$RENDER_MODEL_SERVICE_DEPLOY_HOOK"
    - curl -fsS -X POST "$RENDER_BACKEND_DEPLOY_HOOK"

rpa_ui:
  stage: rpa
  image: python:3.11-slim
  when: manual
  script:
    - echo "Optional RPA stage. Configure Selenium container to run UI flow."
