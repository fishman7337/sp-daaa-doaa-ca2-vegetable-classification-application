  open-pull-requests-limit: 5
- package-ecosystem: docker
  directory: /model_serving
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Asia/Singapore
  open-pull-requests-limit: 5
- package-ecosystem: docker
  directory: /webapp
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Asia/Singapore
  open-pull-requests-limit: 5
