version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Asia/Singapore
  open-pull-requests-limit: 5
- package-ecosystem: pip
  directory: /backend
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Asia/Singapore
  open-pull-requests-limit: 5
  groups:
    pip-dependencies:
      patterns:
      - '*'
- package-ecosystem: pip
  directory: /model_service
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Asia/Singapore
  open-pull-requests-limit: 5
  groups:
    pip-dependencies:
      patterns:
      - '*'
- package-ecosystem: pip
  directory: /model_serving
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Asia/Singapore
  open-pull-requests-limit: 5
  groups:
    pip-dependencies:
      patterns:
      - '*'
- package-ecosystem: pip
  directory: /webapp
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Asia/Singapore
  open-pull-requests-limit: 5
  groups:
    pip-dependencies:
      patterns:
      - '*'
- package-ecosystem: docker
  directory: /backend
  schedule:
    interval: weekly
