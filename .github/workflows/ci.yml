name: CI

on:
  push:
    branches: ["main", "develop", "portfolio/**"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  BACKEND_COVERAGE_MIN: "85"
  MODEL_SERVICE_COVERAGE_MIN: "85"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs-and-lint:
    timeout-minutes: 30
    name: Documentation and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements-dev.txt
            model_service/requirements-dev.txt

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          pip install -r model_service/requirements-dev.txt

      - name: Validate folder documentation
        run: python scripts/check_readmes.py

      - name: Ruff lint
        run: |
          ruff check backend main.py
          ruff check model_service

      - name: Ruff format check
        run: |
          ruff format --check backend main.py
          ruff format --check model_service

  backend-tests:
    timeout-minutes: 30
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run backend pytest suite
        run: |
          mkdir -p reports
          pytest backend/tests \
            --cov=backend \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:reports/backend-coverage.xml \
            --cov-fail-under=${BACKEND_COVERAGE_MIN} \
            --junitxml=reports/backend-tests.xml

      - name: Upload backend test artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-test-artifacts
          path: |
            reports/backend-tests.xml
            reports/backend-coverage.xml

  model-service-tests:
    timeout-minutes: 30
    name: Model service tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: model_service/requirements-dev.txt

      - name: Install model-service dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r model_service/requirements-dev.txt

      - name: Run model-service pytest suite
        run: |
          mkdir -p reports
          pytest model_service/tests \
            --cov=model_service \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:reports/model-service-coverage.xml \
            --cov-fail-under=${MODEL_SERVICE_COVERAGE_MIN} \
            --junitxml=reports/model-service-tests.xml

      - name: Upload model-service test artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: model-service-test-artifacts
          path: |
            reports/model-service-tests.xml
            reports/model-service-coverage.xml

  mlops:
    timeout-minutes: 30
    name: MLOps gates
    runs-on: ubuntu-latest
    needs: [backend-tests, model-service-tests]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements-dev.txt
            model_service/requirements-dev.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          pip install -r model_service/requirements-dev.txt

      - name: Validate model registry
        run: |
          mkdir -p reports
          python scripts/validate_model_registry.py --models-root models --report reports/model-registry-report.json

      - name: Runtime smoke checks
        run: |
          set -euo pipefail
          python main.py > reports/local-stack.log 2>&1 &
          STACK_PID=$!
          trap 'kill ${STACK_PID} >/dev/null 2>&1 || true' EXIT
          python scripts/smoke_serving.py --base-url http://127.0.0.1:8000 --wait-seconds 70
          python scripts/smoke_webapp.py --base-url http://127.0.0.1:5000 --wait-seconds 70

      - name: Upload MLOps artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mlops-artifacts
          path: |
            reports/model-registry-report.json
            reports/local-stack.log

  security:
    timeout-minutes: 30
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            model_service/requirements.txt

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install "bandit[toml]>=1.7,<2" pip-audit

      - name: Bandit SAST
        run: |
          mkdir -p reports
          bandit -r backend model_service -x backend/tests,model_service/tests -ll -ii -s B104 -f json -o reports/bandit-report.json

      - name: Python dependency audit
        run: |
          pip-audit -r backend/requirements-dev.txt
          pip-audit -r model_service/requirements-dev.txt

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload security artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-artifacts
          path: reports/bandit-report.json

  docker-build:
    timeout-minutes: 30
    name: Docker builds
    runs-on: ubuntu-latest
    needs: [docs-and-lint, backend-tests, model-service-tests, mlops, security]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t veggieai/backend:ci .

      - name: Build model-service image
        run: docker build -f model_service/Dockerfile -t veggieai/model-service:ci .
